site_name: TBk Dokumentation
site_description: Inhaltliche Dokumentation des Toolkit Bestandeskarte (TBk) - BFH-HAFL
site_url: https://HAFL-WWI.github.io/TBk-Docs/tbk/
repo_url: https://github.com/HAFL-WWI/TBk-Docs
repo_name: HAFL-WWI/TBk-Docs
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: de
  logo: assets/img/logo.png
  favicon: assets/img/logo.png
  palette:
    # no `media` query on purpose: always starts in light mode regardless of
    # OS/browser dark-mode preference, since the migrated Handbuch screenshots
    # are designed for a white background. Users can still switch manually
    # via the toggle (remembered per-browser via localStorage).
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark Mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light Mode
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Start: Accueil
            Glossar: Glossaire
            Einführung: Introduction
            TBk-Karten: Cartes TBk
            Grundlagen: Informations de base
            Veränderungen Oberschicht: Changements strate supérieure
            Vertikale Struktur: Structure verticale
            Zusatzinfos: Informations complémentaires
            Abgrenzung & Beschreibung: Formation et description
            Grundprinzipien: Principes de base
            Funktionsweise: Fonctionnement de TBk
            Darstellung: Représentation
            Datenquellen: Sources de données
            Vegetationshöhenmodell: Modèle de hauteur (MHV)
            Wichtigste Quellen: Sources principales
            Anhang: Annexe
            Videos: Vidéos
            Entwicklungsstufen: Stades de développement
            Vorratsschätzung: Estimation du matériel sur pied
            Technische Doku →: Documentation technique →
        - locale: en
          name: English
          build: true
          nav_translations:
            Start: Home
            Glossar: Glossary
            Einführung: Introduction
            TBk-Karten: TBk Maps
            Grundlagen: Basics
            Veränderungen Oberschicht: Changes in Upper Layer
            Vertikale Struktur: Vertical Structure
            Zusatzinfos: Additional Information
            Abgrenzung & Beschreibung: Delineation & Description
            Grundprinzipien: Basic Principles
            Funktionsweise: How TBk Works
            Darstellung: Visualization
            Datenquellen: Data Sources
            Vegetationshöhenmodell: Vegetation Height Model
            Wichtigste Quellen: Main Sources
            Anhang: Appendix
            Videos: Videos
            Entwicklungsstufen: Development Stages
            Vorratsschätzung: Volume Estimation
            Technische Doku →: Technical Documentation →
  - to-pdf:
      cover_subtitle: "TBk Dokumentation (Prototyp)"
      output_path: pdf/tbk-dokumentation.pdf

nav:
  - Start: index.md
  - Glossar: glossar.md
  - Einführung: einfuehrung.md
  - TBk-Karten:
      - Grundlagen: tbk-karten/grundlagen.md
      - Veränderungen Oberschicht: tbk-karten/veraenderungen-oberschicht.md
      - Vertikale Struktur: tbk-karten/vertikale-struktur.md
      - Zusatzinfos: tbk-karten/zusatzinfos.md
  - Abgrenzung & Beschreibung:
      - Grundprinzipien: abgrenzung-beschreibung/grundprinzipien.md
      - Funktionsweise: abgrenzung-beschreibung/funktionsweise.md
      - Darstellung: abgrenzung-beschreibung/darstellung.md
  - Datenquellen:
      - Vegetationshöhenmodell: datenquellen/vhm.md
      - Wichtigste Quellen: datenquellen/wichtigste-quellen.md
  - Anhang:
      - Videos: anhang/videos.md
      - Entwicklungsstufen: anhang/entwicklungsstufen.md
      - Vorratsschätzung: anhang/vorratsschaetzung.md
  - Technische Doku →: https://HAFL-WWI.github.io/TBk-Docs/tbk-plugin/
